  <!-- Vertical stem of P -->
  <path d="M34 22 V68"
        stroke="url(#g)"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- P Bowl -->
  <path d="M34 22
           H52
           C66 22 72 30 72 40
           C72 50 66 58 52 58
           H34"
        fill="none"
        stroke="url(#g)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Wave -->
  <path d="M20 78
           C28 72 36 84 44 78
           C52 72 60 84 68 78
           C76 72 84 84 92 78"
        fill="none"
        stroke="#00C2FF"
